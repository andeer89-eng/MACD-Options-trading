name: P0 validation

on:
  push:
    branches:
      - fix/p0-backtest-causal-entries
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and server integration tests
        run: bun run test

      - name: Install Firestore rules test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools

      - name: Test Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-macd-options-rules "bunx tsx --test server/firestoreRules.test.ts"

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build
